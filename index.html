<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        cursor: pointer;
      }
      #play-btn {
        padding: 16px 32px;
        background: #ff4757;
        color: #ffffff;
        border: none;
        border-radius: 50px;
        font-size: 18px;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
      }
      #hint {
        color: #ffffff;
        margin-top: 15px;
        font-family: sans-serif;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <!-- Экран первичного взаимодействия для обхода блокировок браузера -->
    <div id="overlay">
      <button id="play-btn">Запустить ✨</button>
      <div id="hint">Нажмите для старта звука и AR</div>
    </div>

    <!-- Скрытый нативный видео-элемент -->
    <video 
      id="main-video" 
      src="./video.mp4" 
      preload="auto" 
      crossorigin="anonymous"
      playsinline 
      webkit-playsinline 
      style="display: none;">
    </video>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="heart-model" src="./heart.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target-anchor" mindar-image-target="targetIndex: 0">
        <!-- Плоскость с материалом на основе нативного видео -->
        <a-plane 
          id="ar-plane" 
          position="0 0 0" 
          height="1.5" 
          width="1" 
          material="src: #main-video; shader: flat; transparent: false;">
        </a-plane>
        
        <!-- 3D Сердечко -->
        <a-gltf-model 
          id="ar-heart" 
          src="#heart-model" 
          position="0 0 0.3" 
          scale="0.35 0.35 0.35" 
          visible="false"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      const overlay = document.querySelector('#overlay');
      const video = document.querySelector('#main-video');
      const plane = document.querySelector('#ar-plane');
      const heart = document.querySelector('#ar-heart');
      const targetAnchor = document.querySelector('#target-anchor');

      let isReady = false;

      // Старт воспроизведения и синхронизация текстуры
      overlay.addEventListener('click', () => {
        video.play().then(() => {
          overlay.style.display = 'none';
          isReady = true;
        }).catch(err => {
          console.error("Ошибка автозапуска видео:", err);
          overlay.style.display = 'none';
        });
      });

      // Управление паузой/воспроизведением при попадании фото в кадр
      targetAnchor.addEventListener("targetFound", () => {
        if (isReady && !video.ended) {
          video.play();
        }
      });

      targetAnchor.addEventListener("targetLost", () => {
        if (isReady) {
          video.pause();
        }
      });

      // Переключение на 3D-модель по завершении видео
      video.addEventListener('ended', () => {
        plane.setAttribute('visible', 'false');
        heart.setAttribute('visible', 'true');
      });
    </script>
  </body>
</html>
