<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Gift</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
      }
      #start-btn {
        padding: 16px 36px;
        background: #ff4757;
        color: #ffffff;
        border: none;
        border-radius: 50px;
        font-size: 18px;
        font-weight: bold;
        box-shadow: 0 4px 20px rgba(255, 71, 87, 0.5);
        cursor: pointer;
      }
      #hint {
        color: #e0e0e0;
        margin-top: 16px;
        font-family: sans-serif;
        font-size: 14px;
        text-align: center;
        padding: 0 20px;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <button id="start-btn">Нажми, чтобы начать ✨</button>
      <div id="hint">После нажатия наведите камеру на фотографию</div>
    </div>

    <!-- Видео заменено на ./3.mp4 -->
    <video 
      id="video-feed" 
      src="./3.mp4" 
      preload="auto" 
      crossorigin="anonymous"
      playsinline 
      webkit-playsinline 
      x5-playsinline
      style="display: none;">
    </video>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="heart-model" src="./heart.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        <!-- Видео плоскость -->
        <a-plane 
          id="video-mesh" 
          position="0 0 0" 
          height="1.5" 
          width="1" 
          material="src: #video-feed; shader: flat; side: double; transparent: false;">
        </a-plane>
        
        <!-- 3D Сердечко -->
        <a-gltf-model 
          id="heart-mesh" 
          src="#heart-model" 
          position="0 0 0.35" 
          scale="0.35 0.35 0.35" 
          visible="false"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      const overlay = document.querySelector('#overlay');
      const startBtn = document.querySelector('#start-btn');
      const video = document.querySelector('#video-feed');
      const videoMesh = document.querySelector('#video-mesh');
      const heartMesh = document.querySelector('#heart-mesh');
      const arTarget = document.querySelector('#ar-target');

      let targetVisible = false;
      let userStarted = false;

      // Обработка клика: инициализация и старт
      startBtn.addEventListener('click', () => {
        userStarted = true;
        overlay.style.display = 'none';
        
        video.play().then(() => {
          if (!targetVisible) {
            video.pause();
          }
        }).catch(err => console.log("Init video play:", err));
      });

      // События обнаружения и потери цели
      arTarget.addEventListener('targetFound', () => {
        targetVisible = true;
        if (userStarted && !video.ended) {
          video.play();
        }
      });

      arTarget.addEventListener('targetLost', () => {
        targetVisible = false;
        if (userStarted && !video.ended) {
          video.pause();
        }
      });

      // Принудительное обновление текстуры WebGL
      video.addEventListener('timeupdate', () => {
        const mesh = videoMesh.getObject3D('mesh');
        if (mesh && mesh.material && mesh.material.map) {
          mesh.material.map.needsUpdate = true;
        }
      });

      // Переключение на 3D-сердечко в конце
      video.addEventListener('ended', () => {
        videoMesh.setAttribute('visible', 'false');
        heartMesh.setAttribute('visible', 'true');
      });
    </script>
  </body>
</html>
