<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Gift</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script>
      // Компонент автоматического приведения любой 3D-модели к аккуратному размеру
      AFRAME.registerComponent('auto-fit-model', {
        schema: { size: { type: 'number', default: 0.35 } },
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const obj = this.el.getObject3D('mesh');
            if (!obj) return;

            const box = new THREE.Box3().setFromObject(obj);
            const center = new THREE.Vector3();
            const size = new THREE.Vector3();
            box.getCenter(center);
            box.getSize(size);

            // Центрируем модель в точке привязки
            obj.position.x -= center.x;
            obj.position.y -= center.y;
            obj.position.z -= center.z;

            // Вычисляем коэффициент масштабирования под целевой размер
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
              const scaleFactor = this.data.size / maxDim;
              obj.scale.set(scaleFactor, scaleFactor, scaleFactor);
            }
          });
        }
      });
    </script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
      }
      #start-btn {
        padding: 16px 36px;
        background: #ff4757;
        color: #ffffff;
        border: none;
        border-radius: 50px;
        font-size: 18px;
        font-weight: bold;
        box-shadow: 0 4px 20px rgba(255, 71, 87, 0.5);
        cursor: pointer;
      }
      #hint {
        color: #e0e0e0;
        margin-top: 16px;
        font-family: sans-serif;
        font-size: 14px;
        text-align: center;
        padding: 0 20px;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <button id="start-btn">Нажми, чтобы начать ✨</button>
      <div id="hint">После нажатия наведите камеру на фотографию</div>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="ar-video-src" 
          src="./3.mp4" 
          preload="auto" 
          crossorigin="anonymous"
          playsinline 
          webkit-playsinline 
          muted 
          loop="false">
        </video>
        <a-asset-item id="heart-model" src="./heart.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        <!-- Видео -->
        <a-video 
          id="ar-video-mesh" 
          src="#ar-video-src" 
          position="0 0 0" 
          height="1.5" 
          width="1" 
          rotation="0 0 0">
        </a-video>
        
        <!-- Контейнер вращения 3D-модели -->
        <a-entity 
          id="heart-container" 
          position="0 0 0.15" 
          visible="false"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
          <!-- 3D Сердечко с авто-подгонкой размера -->
          <a-gltf-model 
            id="heart-mesh" 
            src="#heart-model" 
            auto-fit-model="size: 0.35">
          </a-gltf-model>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const overlay = document.querySelector('#overlay');
      const startBtn = document.querySelector('#start-btn');
      const video = document.querySelector('#ar-video-src');
      const videoMesh = document.querySelector('#ar-video-mesh');
      const heartContainer = document.querySelector('#heart-container');
      const arTarget = document.querySelector('#ar-target');

      let targetVisible = false;
      let isUnlocked = false;

      startBtn.addEventListener('click', () => {
        overlay.style.display = 'none';
        video.muted = false;
        video.play().then(() => {
          isUnlocked = true;
          if (!targetVisible) {
            video.pause();
          }
        }).catch(() => {
          video.muted = true;
          video.play();
          isUnlocked = true;
          if (!targetVisible) {
            video.pause();
          }
        });
      });

      arTarget.addEventListener('targetFound', () => {
        targetVisible = true;
        if (isUnlocked && !video.ended) {
          video.play();
        }
      });

      arTarget.addEventListener('targetLost', () => {
        targetVisible = false;
        if (isUnlocked && !video.ended) {
          video.pause();
        }
      });

      video.addEventListener('ended', () => {
        videoMesh.setAttribute('visible', 'false');
        heartContainer.setAttribute('visible', 'true');
      });
    </script>
  </body>
</html>
