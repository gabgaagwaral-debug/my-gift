<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Gift</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script>
      // Генератор идеального объемного 3D-сердца через Three.js
      AFRAME.registerComponent('procedural-heart', {
        init: function () {
          const x = 0, y = 0;
          const heartShape = new THREE.Shape();
          heartShape.moveTo(x + 0.25, y + 0.25);
          heartShape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.20, y, x, y);
          heartShape.bezierCurveTo(x - 0.30, y, x - 0.30, y + 0.35, x - 0.30, y + 0.35);
          heartShape.bezierCurveTo(x - 0.30, y + 0.55, x - 0.10, y + 0.77, x + 0.25, y + 0.95);
          heartShape.bezierCurveTo(x + 0.60, y + 0.77, x + 0.80, y + 0.55, x + 0.80, y + 0.35);
          heartShape.bezierCurveTo(x + 0.80, y + 0.35, x + 0.80, y, x + 0.50, y);
          heartShape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

          const extrudeSettings = {
            depth: 0.2,
            bevelEnabled: true,
            bevelSegments: 5,
            steps: 2,
            bevelSize: 0.08,
            bevelThickness: 0.08
          };

          const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
          geometry.center();

          const material = new THREE.MeshStandardMaterial({
            color: 0xff1e42,
            roughness: 0.2,
            metalness: 0.3
          });

          const mesh = new THREE.Mesh(geometry, material);
          mesh.rotation.x = Math.PI; // Переворачиваем правильной стороной
          mesh.scale.set(0.4, 0.4, 0.4); // Аккуратный размер над фото
          this.el.setObject3D('mesh', mesh);
        }
      });
    </script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
      }
      #start-btn {
        padding: 16px 36px;
        background: #ff4757;
        color: #ffffff;
        border: none;
        border-radius: 50px;
        font-size: 18px;
        font-weight: bold;
        box-shadow: 0 4px 20px rgba(255, 71, 87, 0.5);
        cursor: pointer;
      }
      #hint {
        color: #e0e0e0;
        margin-top: 16px;
        font-family: sans-serif;
        font-size: 14px;
        text-align: center;
        padding: 0 20px;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <button id="start-btn">Нажми, чтобы начать ✨</button>
      <div id="hint">После нажатия наведите камеру на фотографию</div>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="ar-video-src" 
          src="./3.mp4" 
          preload="auto" 
          crossorigin="anonymous"
          playsinline 
          webkit-playsinline 
          muted 
          loop="false">
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Освещение для бликов на 3D-сердечке -->
      <a-entity light="type: ambient; intensity: 0.8;"></a-entity>
      <a-entity light="type: directional; intensity: 1.2; position: 1 2 2;"></a-entity>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        <!-- Видео -->
        <a-video 
          id="ar-video-mesh" 
          src="#ar-video-src" 
          position="0 0 0" 
          height="1.5" 
          width="1" 
          rotation="0 0 0">
        </a-video>
        
        <!-- Объемное 3D Сердечко -->
        <a-entity 
          id="heart-entity" 
          procedural-heart 
          position="0 0 0.25" 
          visible="false"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const overlay = document.querySelector('#overlay');
      const startBtn = document.querySelector('#start-btn');
      const video = document.querySelector('#ar-video-src');
      const videoMesh = document.querySelector('#ar-video-mesh');
      const heartEntity = document.querySelector('#heart-entity');
      const arTarget = document.querySelector('#ar-target');

      let targetVisible = false;
      let isUnlocked = false;

      startBtn.addEventListener('click', () => {
        overlay.style.display = 'none';
        video.muted = false;
        video.play().then(() => {
          isUnlocked = true;
          if (!targetVisible) {
            video.pause();
          }
        }).catch(() => {
          video.muted = true;
          video.play();
          isUnlocked = true;
          if (!targetVisible) {
            video.pause();
          }
        });
      });

      arTarget.addEventListener('targetFound', () => {
        targetVisible = true;
        if (isUnlocked && !video.ended) {
          video.play();
        }
      });

      arTarget.addEventListener('targetLost', () => {
        targetVisible = false;
        if (isUnlocked && !video.ended) {
          video.pause();
        }
      });

      video.addEventListener('ended', () => {
        videoMesh.setAttribute('visible', 'false');
        heartEntity.setAttribute('visible', 'true');
      });
    </script>
  </body>
</html>
